<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Daily Task Planner</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container py-5">

        <div class="todo-container mx-auto">

            <!-- Header -->
            <div class="header">
                <div class="header-icon">
                    <i class="fa-solid fa-list-check"></i>
                </div>

                <h1>Daily Task Planner</h1>
                <p id="date"></p>
            </div>

            <!-- Add Task -->
            <div class="input-box">

                <input type="text" id="taskInput" class="form-control" placeholder="What do you need to do?">

                <button type="button" class="btn add-btn" onclick="addTask()" aria-label="Add task">
                    <i class="fa-solid fa-plus"></i>
                </button>

            </div>

            <!-- Filters -->
            <div class="filters">

                <button class="filter-btn active" onclick="filterTasks('all', this)">
                    <i class="fa-solid fa-list"></i>
                    All
                </button>

                <button class="filter-btn" onclick="filterTasks('pending', this)">
                    <i class="fa-regular fa-clock"></i>
                    Pending
                </button>

                <button class="filter-btn" onclick="filterTasks('completed', this)">
                    <i class="fa-solid fa-check"></i>
                    Completed
                </button>

            </div>

            <!-- Task List -->
            <div id="taskList"></div>

            <!-- Empty Message -->
            <div id="emptyMessage" class="empty-message">
                <i class="fa-regular fa-clipboard"></i>
                <p>No tasks yet. Add your first task!</p>
            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
